[package]
name = "hot-vampires"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = "=0.38.0"
ash-window = "=0.13.0"
winit = "=0.30.13"
raw-window-handle = "=0.6.2"
egui = "=0.33.3"
egui-winit = "=0.33.3"
egui-ash-renderer = "=0.10.0"
glam = { version = "=0.30.10", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
bytemuck = { version = "=1.25.2", features = ["derive"] }

[build-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in", "spv-out"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

